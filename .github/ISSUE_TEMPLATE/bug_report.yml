name: Bug report
description: Report a reproducible problem with the editor or server package.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping us improve Shopify Rich Text Editor.
  - type: input
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      placeholder: "@standhigher/shopify-rich-text-editor"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal code, steps, or a public reproduction.
      placeholder: |
        1. Install package...
        2. Render component...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include React, Polaris, Tiptap, Node.js, browser, and framework versions.
      placeholder: |
        React:
        Polaris:
        Tiptap:
        Node.js:
        Browser:
        Framework:
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed private merchant data, tokens, and store URLs.
          required: true
        - label: I checked the latest version before reporting.
          required: true
