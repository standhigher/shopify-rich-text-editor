name: Feature request
description: Suggest a feature or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired API, behavior, or UI.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor UI
        - Tiptap extensions
        - Shopify image upload
        - Server rendering
        - Sanitization
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workarounds or alternatives have you considered?
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request does not include private merchant data or credentials.
          required: true
